# Experimental: builds the union merge branch `union-merge` (Orpheon 1.0.0 + Spotify integration
# restored; source committed durably by push-union.yml). Manual dispatch only; publishes nothing.
name: Union build


on:
  workflow_dispatch:


permissions:
  contents: read


defaults:
  run:
    working-directory: base


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: union-merge


      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"


      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"


      - uses: gradle/actions/setup-gradle@v6


      - name: Debug APK
        run: ./gradlew assembleDebug


      - name: Sign debug APKs with the persistent derivative-build key
        working-directory: .
        env:
          KS_B64: ${{ secrets.MYSPOTI_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MYSPOTI_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MYSPOTI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MYSPOTI_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KS_B64"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/union.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1)
          for APK in base/app/build/outputs/apk/debug/*.apk; do
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/union.keystore" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KS_ALIAS" --out "$APK.signed" "$APK"
            mv "$APK.signed" "$APK"
          done
          rm -f "$RUNNER_TEMP/union.keystore"


      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :host-android:testDebugUnitTest :extensions:test :api:test :catalog:test :pass:test :automix:test


      - name: Upload screenshot PNGs
 working-directory: .
 if: always()
 uses: actions/upload-artifact@v7
 with:
 name: orpheon-union-screens
 path: base/app/build/outputs/roborazzi/*.png
 if-no-files-found: warn
 retention-days: 14

 - name: APK identity
        working-directory: .
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1)
          for APK in base/app/build/outputs/apk/debug/*.apk; do
            echo "== $APK =="
            "$BT/aapt" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion" || true
