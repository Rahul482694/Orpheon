# Experimental: builds the union merge branch `union-merge` (Orpheon 1.0.0 + Spotify integration
# restored; source committed durably by push-union.yml). Manual dispatch only; publishes nothing.
name: Union build

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: union-merge

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :host-android:testDebugUnitTest :extensions:test :api:test :catalog:test :pass:test :automix:test

      - name: APK identity
        working-directory: .
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1)
          for APK in base/app/build/outputs/apk/debug/*.apk; do
            echo "== $APK =="
            "$BT/aapt" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion" || true
            "$BT/apksigner" verify --print-certs "$APK" 2>/dev/null | head -4 || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: orpheon-union-debug
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14
