# Experimental: builds the union merge branch `union-merge` (Orpheon 1.0.0 + Spotify integration
# restored; source committed durably by push-union.yml). Manual dispatch only; publishes nothing.
name: Union build


on:
  workflow_dispatch:


permissions:
  contents: write


defaults:
  run:
    working-directory: base


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: union-merge


      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"


      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"


      - uses: gradle/actions/setup-gradle@v6


      - name: Debug APK
        run: ./gradlew assembleDebug


      - name: Sign debug APKs with the persistent derivative-build key
        working-directory: .
        env:
          KS_B64: ${{ secrets.MYSPOTI_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MYSPOTI_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MYSPOTI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MYSPOTI_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KS_B64"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/union.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1)
          for APK in base/app/build/outputs/apk/debug/*.apk; do
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/union.keystore" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KS_ALIAS" --out "$APK.signed" "$APK"
            mv "$APK.signed" "$APK"
          done
          rm -f "$RUNNER_TEMP/union.keystore"


      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :host-android:testDebugUnitTest :extensions:test :api:test :catalog:test :pass:test :automix:test


      - name: APK identity
        working-directory: .
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -1)
          : > base/identity.txt
          for APK in base/app/build/outputs/apk/debug/*.apk; do
            echo "== $APK ==" | tee -a base/identity.txt
            "$BT/aapt" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion" | tee -a base/identity.txt || true
            "$BT/apksigner" verify --print-certs "$APK" 2>/dev/null | head -4 | tee -a base/identity.txt || true
          done

      - name: Upload screenshot PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orpheon-union-screens
          path: |
            base/app/build/outputs/roborazzi/*.png
            base/identity.txt
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: orpheon-union-debug
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish evidence files
        working-directory: base
        run: |
          git config user.name evidence-bot
          git config user.email bot@users.noreply.github.com
          if [ -z "$(ls app/build/outputs/roborazzi/*.png 2>/dev/null)" ]; then
            rm -rf app/build/test-results/testDebugUnitTest app/build/reports/tests/testDebugUnitTest
            ./gradlew :app:testDebugUnitTest --no-build-cache || true
          fi
          ls -la app/build/outputs/roborazzi || true
          F=$(find app/build/outputs/roborazzi -iname '*choice*.png' -print -quit 2>/dev/null || true)
          echo "chosen PNG: $F"
          git switch -c "evidence-run-$GITHUB_RUN_ID"
          mkdir -p evidence
          cp identity.txt evidence/
          if [ -n "$F" ]; then cp "$F" evidence/screen.png; fi
          git add evidence
          git commit -m "evidence for run $GITHUB_RUN_ID"
          git push origin "evidence-run-$GITHUB_RUN_ID"
