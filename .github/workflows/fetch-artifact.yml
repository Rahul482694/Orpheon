# Experimental helper: moves a workflow-run artifact to a temporary public file host so it can
# be fetched outside GitHub. Used to deliver experimental APK builds. Manual dispatch only.
name: Fetch artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id whose artifact to fetch"
        required: true
      artifact_name:
        description: "Artifact name"
        required: true
      out_name:
        description: "Output file name for the uploaded file"
        required: true

permissions:
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" -n "${{ inputs.artifact_name }}" -D /tmp/art
          ls -la /tmp/art
          APK=$(find /tmp/art -name '*arm64-v8a*.apk' | head -1)
          ls -la "$APK"
          SRV=$(curl -fsS -m 30 "https://api.gofile.io/servers" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['data']['servers'][0]['name'])")
          echo "SERVER=$SRV"
          RESP=$(curl -fsS -m 900 -F "file=@$APK;filename=${{ inputs.out_name }}" "https://${SRV}.gofile.io/contents/uploadfile" || curl -fsS -m 900 -F "file=@$APK;filename=${{ inputs.out_name }}" "https://${SRV}.gofile.io/uploadFile")
          echo "UPLOAD_RESPONSE=$RESP"
