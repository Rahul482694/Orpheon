# Experimental helper: moves a workflow-run artifact to a temporary public file host so it can
# be fetched outside GitHub. Used to deliver experimental APK builds. Manual dispatch only.
name: Fetch artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id whose artifact to fetch"
        required: true
      artifact_name:
        description: "Artifact name"
        required: true
      out_name:
        description: "Output file name for the uploaded file"
        required: true

permissions:
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" -n "${{ inputs.artifact_name }}" -D /tmp/art
          ls -la /tmp/art
          APK=$(find /tmp/art -name '*.apk' | head -1)
          ls -la "$APK"
          RESP=$(curl -fsS -m 600 -F reqtype=fileupload -F time=72h -F "fileToUpload=@$APK;filename=${{ inputs.out_name }}" https://litterbox.catbox.moe/resources/internals/api.php)
          echo "UPLOAD_RESPONSE=$RESP"
